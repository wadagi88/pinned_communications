# Pinned Communications — static surface, no build step on Netlify.
# Pages are generated locally by _build/build.sh and committed.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Assets carry ?v= but phones cache hard; a stale stylesheet silently undoes a
# fix. Revalidating costs a 304 and guarantees the team sees what was shipped.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# The email artefacts are a developer reference, not a page. They are served so
# a build can be compared against a rendering, and kept out of search the way
# every generated page is by its own meta tag — these are email markup, and
# nothing in them is edited for a reason that is not an email client.
# The plain-text sources exist so a browser shows the markup instead of
# rendering it. Without this, .html.txt is sniffed back to text/html by some
# proxies and the whole point is lost.
[[headers]]
  for = "/email/src/*"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/email/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache, must-revalidate"
